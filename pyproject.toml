[project]
name = "dashbls"
description = "Python 3.x binds for Dash's bls-signatures"
authors = [{ name = "Dash Core Developers" }]
keywords = ["bls", "signatures", "bls12-381", "dash", "cryptography"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/dashpay/bls-signatures"
Source = "https://github.com/dashpay/bls-signatures"
Issues = "https://github.com/dashpay/bls-signatures/issues"

[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8", "pybind11>=2.13.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"
